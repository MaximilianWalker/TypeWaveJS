name: Publish Packages

# Runs when a release PR (dev -> main) is merged. Versions are bumped on dev
# inside the release PR; this workflow never commits or pushes. It publishes
# every package whose package.json version is not on npm yet.
on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint React workspace
        run: npm --workspace @typewavejs/react run lint

      - name: Test React workspace
        run: npm --workspace @typewavejs/react run test

      - name: Build React workspace
        run: npm --workspace @typewavejs/react run build

  publish:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@typewavejs"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React workspace
        run: npm --workspace @typewavejs/react run build

      # scripts/publish.js runs `npm view <name>@<version> version` for each
      # public package and publishes only versions that are not on npm yet.
      - name: Publish unpublished package versions
        run: npm run publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
