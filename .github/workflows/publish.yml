name: Publish Packages

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint React workspace
        run: npm --workspace @typewavejs/react run lint

      - name: Test React workspace
        run: npm --workspace @typewavejs/react run test

      - name: Build React workspace
        run: npm --workspace @typewavejs/react run build

  bump_versions:
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      bumped: ${{ steps.detect.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Bump versions that already exist on npm
        run: npm run bump:published

      - name: Detect version changes
        id: detect
        shell: bash
        run: |
          if git diff --quiet; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh lockfile
        if: steps.detect.outputs.bumped == 'true'
        run: npm install --package-lock-only

      - name: Commit version bump
        if: steps.detect.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json package-lock.json
          git commit -m "chore(release): bump published package versions"
          git push

  publish:
    runs-on: ubuntu-latest
    needs: [validate, bump_versions]
    if: needs.bump_versions.outputs.bumped == 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@typewavejs"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build React workspace
        run: npm --workspace @typewavejs/react run build

      - name: Publish packages
        run: npm run publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
